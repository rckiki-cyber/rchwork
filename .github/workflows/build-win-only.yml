name: Build Win-only (slim) and publish to Tencent COS

# 用于"只重新构建 Windows 安装包并覆盖 COS"的通道(不动 mac/linux)。
# 可复用同一个版本号(如 v0.3.30),把最新的 slim win-x64 覆盖到 COS latest。
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to use, e.g. v0.3.30'
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: 22
  WORKING_DIRECTORY: apps/desktop-legalwork

jobs:
  build-win:
    name: Build slim Windows x64 + publish to Tencent COS
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci

      - name: Build Windows x64 installer
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          LEGALWORK_APP_VERSION: ${{ github.event.inputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGALWORK_ERROR_REPORT_GITHUB_REPO: ${{ secrets.ERROR_REPORT_REPO }}
          LEGALWORK_ERROR_REPORT_GITHUB_TOKEN: ${{ secrets.ERROR_REPORT_TOKEN }}
          LEGALWORK_ERROR_REPORT_GITHUB_LABEL: ${{ secrets.ERROR_REPORT_LABEL }}
        run: npm run dist:win

      # 把 Windows 安装包同步到腾讯云 COS(国内直下),覆盖同版本号的 win。
      - name: Publish Windows installer to Tencent COS
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          S3_BUCKET: legalwork-1318565101
          S3_ENDPOINT: https://cos.ap-guangzhou.myqcloud.com
          S3_REGION: ap-guangzhou
          S3_FORCE_PATH_STYLE: 'false'
          S3_ACCESS_KEY_ID: ${{ secrets.COS_SECRET_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.COS_SECRET_KEY }}
          R2_PUBLIC_BASE_URL: https://legalwork-1318565101.cos.ap-guangzhou.myqcloud.com
          R2_RELEASE_PREFIX: legalwork
          RELEASE_CHANNEL: stable
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag_name }}"
          node scripts/publish-r2.mjs upload --platform win --tag "$TAG" --channel stable --dist dist
          node scripts/publish-r2.mjs promote --tag "$TAG" --channel stable --platforms win
