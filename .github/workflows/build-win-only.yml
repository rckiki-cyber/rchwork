name: Build Win-only (slim) and publish to Tencent COS

# 用于"只重新构建 Windows 安装包并覆盖 COS"的通道(不动 mac/linux)。
# 可复用同一个版本号(如 v0.3.30),把最新的 slim win-x64 覆盖到 COS latest。
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to use, e.g. v0.3.30'
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: 22
  WORKING_DIRECTORY: apps/desktop-legalwork

jobs:
  build-win:
    name: Build slim Windows x64 + publish to Tencent COS
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci

      - name: Build Windows x64 (NSIS installer + portable ZIP)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          LEGALWORK_APP_VERSION: ${{ github.event.inputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGALWORK_ERROR_REPORT_GITHUB_REPO: ${{ secrets.ERROR_REPORT_REPO }}
          LEGALWORK_ERROR_REPORT_GITHUB_TOKEN: ${{ secrets.ERROR_REPORT_TOKEN }}
          LEGALWORK_ERROR_REPORT_GITHUB_LABEL: ${{ secrets.ERROR_REPORT_LABEL }}
        run: |
          npm run dist:win
          npx --yes electron-builder@26.8.1 --config electron-builder.config.cjs --publish never --win zip --x64

      # CI 只负责构建;产物作为 artifact 保存,由外部(my Mac)下载后传 COS,
      # 避免 CI 上 COS 上传(publish-cos)偶发失败导致拿不到包。
      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            ${{ env.WORKING_DIRECTORY }}/dist/legalwork-*-win-x64.exe
            ${{ env.WORKING_DIRECTORY }}/dist/legalwork-*-win-x64.exe.blockmap
            ${{ env.WORKING_DIRECTORY }}/dist/legalwork-*-win-x64.zip
            ${{ env.WORKING_DIRECTORY }}/dist/latest.yml
          if-no-files-found: error
