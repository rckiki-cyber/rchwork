name: Apply knowledge chat fix

on:
  push:
    branches:
      - fix/knowledge-chat-notebooklm
    paths:
      - .legalwork-patches/apply_knowledge_chat_fix.py
      - .github/workflows/apply-knowledge-chat-fix.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/knowledge-chat-notebooklm
          fetch-depth: 0

      - name: Normalize migration string literals
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.legalwork-patches/apply_knowledge_chat_fix.py')
          text = path.read_text(encoding='utf-8')
          markers = (
              '  const pollKnowledgeChat = useCallback',
              '  const sendKnowledgeChatMessage = useCallback',
              '      // Convert [来源 N] references',
              '      const encodedScope = encodeURIComponent(sourceScope)',
          )
          for marker in markers:
              text = text.replace(f'    """{marker}', f'    r"""{marker}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply source migration
        id: migrate
        shell: bash
        run: |
          set +e
          rm -f .legalwork-patches/run-output.txt
          python3 .legalwork-patches/apply_knowledge_chat_fix.py > .legalwork-patches/run-output.txt 2>&1
          status=$?
          cat .legalwork-patches/run-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist migration diagnostics
        if: steps.migrate.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .legalwork-patches/run-output.txt
          git commit -m "chore: capture knowledge chat migration failure"
          git push origin HEAD:fix/knowledge-chat-notebooklm
          exit 1

      - name: Install desktop dependencies
        if: steps.migrate.outputs.status == '0'
        run: npm ci --prefix apps/desktop-legalwork --ignore-scripts

      - name: Typecheck desktop app
        if: steps.migrate.outputs.status == '0'
        run: npm --prefix apps/desktop-legalwork run typecheck

      - name: Remove one-shot migration files
        if: steps.migrate.outputs.status == '0'
        run: |
          rm -f .legalwork-patches/apply_knowledge_chat_fix.py
          rm -f .legalwork-patches/run-output.txt
          rmdir .legalwork-patches 2>/dev/null || true
          rm -f .github/workflows/apply-knowledge-chat-fix.yml

      - name: Commit generated source changes
        if: steps.migrate.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(knowledge): stream reasoning and add scoped citations"
          git push origin HEAD:fix/knowledge-chat-notebooklm
