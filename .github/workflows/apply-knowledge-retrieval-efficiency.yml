name: Apply knowledge retrieval efficiency patch

on:
  push:
    branches:
      - agent/knowledge-retrieval-efficiency
    paths:
      - .legalwork-patches/apply_ima_direct_dispatch.py
      - .github/workflows/apply-knowledge-retrieval-efficiency.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/knowledge-retrieval-efficiency
          fetch-depth: 0

      - name: Apply IMA direct-dispatch patch
        run: python3 .legalwork-patches/apply_ima_direct_dispatch.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop-legalwork/legalwork/package-lock.json

      - name: Install runtime test dependencies
        working-directory: apps/desktop-legalwork/legalwork
        run: npm ci --ignore-scripts

      - name: Run focused knowledge and loop tests
        working-directory: apps/desktop-legalwork/legalwork
        run: >-
          npm test --
          src/adapters/tool/knowledge-tool-output.test.ts
          src/knowledge/knowledge-query-planner.test.ts
          src/knowledge/knowledge-retrieval-pipeline.test.ts
          tests/loop.test.ts

      - name: Typecheck runtime
        working-directory: apps/desktop-legalwork/legalwork
        run: npm run typecheck

      - name: Commit verified source changes and remove one-shot patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .legalwork-patches/apply_ima_direct_dispatch.py
          git rm .github/workflows/apply-knowledge-retrieval-efficiency.yml
          git add apps/desktop-legalwork/legalwork/src/loop/agent-loop.ts
          git add apps/desktop-legalwork/legalwork/tests/loop.test.ts
          if git diff --cached --quiet; then
            echo "No verified source changes to commit."
            exit 1
          fi
          git commit -m "perf(ima): prefetch auto-routed knowledge without model round-trip"
          git push origin HEAD:agent/knowledge-retrieval-efficiency
